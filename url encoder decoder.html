<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Encoder/Decoder</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #1e293b;
      padding: 25px 35px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      max-width: 600px;
      width: 90%;
    }
    h1 {
      margin-bottom: 15px;
      font-size: 24px;
      text-align: center;
      color: #38bdf8;
    }
    textarea {
      width: 100%;
      height: 180px;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-family: 'Fira Code', monospace;
      resize: none;
      outline: none;
      background: #0f172a;
      color: #e2e8f0;
      margin-bottom: 15px;
    }
    .buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 10px;
      background: #38bdf8;
      border: none;
      color: #0f172a;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #0ea5e9;
    }
    .result {
      margin-top: 15px;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      word-break: break-all;
      min-height: 80px;
      font-family: 'Fira Code', monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>URL Encoder / Decoder</h1>
    <textarea id="inputText" placeholder="Paste or type your text here..."></textarea>
    <div class="buttons">
      <button onclick="processText()">Process</button>
      <button onclick="copyResult()">Copy</button>
      <button onclick="clearAll()">Clear</button>
    </div>
    <div class="result" id="resultBox">Processed result will appear here...</div>
  </div>

  <script>
    function isEncoded(str) {
      try {
        return decodeURIComponent(str) !== str;
      } catch (e) {
        return false;
      }
    }

    function processText() {
      const input = document.getElementById('inputText').value.trim();
      const resultBox = document.getElementById('resultBox');

      if (!input) {
        resultBox.textContent = 'Please enter text first!';
        return;
      }

      let result;
      if (isEncoded(input)) {
        result = decodeURIComponent(input);
        resultBox.style.color = '#facc15';
      } else {
        result = encodeURIComponent(input);
        resultBox.style.color = '#4ade80';
      }

      resultBox.textContent = result;
    }

    function copyResult() {
      const resultText = document.getElementById('resultBox').textContent;
      navigator.clipboard.writeText(resultText).then(() => {
        alert('Copied to clipboard!');
      });
    }

    function clearAll() {
      document.getElementById('inputText').value = '';
      document.getElementById('resultBox').textContent = 'Processed result will appear here...';
    }
  </script>
</body>
</html>
