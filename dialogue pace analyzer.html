<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialogue Pacer | EngiSimulation Tools</title>
    <style>
        /* Basic Styling */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #0056b3;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            min-height: 250px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 15px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .results-section {
            margin-top: 30px;
            padding: 20px;
            border: 2px solid #28a745;
            border-radius: 4px;
            background-color: #e2ffe8;
        }
        #statsOutput {
            font-size: 1.1em;
            line-height: 1.6;
        }
        .analysis-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .analysis-table th, .analysis-table td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        .analysis-table th {
            background-color: #28a745;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🗣️ Dialogue Pacer</h2>
        <p>Paste a scene or script excerpt below. The tool will measure dialogue length to analyze pacing.</p>
        <p><strong>Note:</strong> Dialogue should be enclosed in **quotes ('...')** for proper analysis.</p>

        <label for="textInput">Your Script/Text:</label>
        <textarea id="textInput" placeholder="Example: 
John said, 'I can't believe the server crashed at midnight!' 
Mary replied, 'It was expected. Everything is failing. We should have migrated last week.' 
John responded, 'I know, but migration is a three-day job.'"></textarea>
        
        <button onclick="analyzeDialogue()">Analyze Dialogue Pacing</button>

        <div class="results-section">
            <h3>Pacing Analysis:</h3>
            <div id="statsOutput">
                Paste text and click 'Analyze Dialogue Pacing'.
            </div>
        </div>

    </div>

    <script>
        // Simple word counter
        function getWordCount(text) {
            text = text.trim();
            if (text === "") return 0;
            return text.split(/\s+/).filter(word => word.length > 0).length;
        }

        function analyzeDialogue() {
            const fullText = document.getElementById('textInput').value;
            const outputDiv = document.getElementById('statsOutput');
            
            if (!fullText.trim()) {
                outputDiv.innerHTML = '<p style="color:red;">Please paste text to analyze.</p>';
                return;
            }

            // Regex to find content enclosed in double quotes (the dialogue)
            const dialogueRegex = /'(.*?)'/g ; 
            const dialogueMatches = fullText.match(dialogueRegex) || [];

            let totalDialogueWords = 0;
            let dialogueSegments = []; // Array to store details of each speech segment

            // 1. Process each dialogue match
            dialogueMatches.forEach(match => {
                // Remove the surrounding quotes
                const speech = match.slice(1, -1).trim(); 
                const wordCount = getWordCount(speech);

                if (wordCount > 0) {
                    dialogueSegments.push({
                        text: speech,
                        words: wordCount
                    });
                    totalDialogueWords += wordCount;
                }
            });

            const totalWordsInFullText = getWordCount(fullText);
            const totalSegments = dialogueSegments.length;
            const avgDialogueLength = totalSegments > 0 ? (totalDialogueWords / totalSegments).toFixed(1) : 0;
            
            // 2. Classify Pacing based on average length
            let paceClassification = 'N/A';
            if (avgDialogueLength > 0) {
                if (avgDialogueLength < 8) {
                    paceClassification = '<span style="color:#28a745;">**Fast/Snappy Pace** (Quick exchanges, high energy).</span>';
                } else if (avgDialogueLength >= 8 && avgDialogueLength <= 20) {
                    paceClassification = '<span style="color:#0056b3;">**Moderate/Balanced Pace** (Typical conversation length).</span>';
                } else {
                    paceClassification = '<span style="color:#dc3545;">**Slow/Heavy Pace** (Long speeches, monologues, or philosophical debate).</span>';
                }
            }

            // 3. Generate Output HTML
            let html = `
                <p><strong>Pace Classification:</strong> ${paceClassification}</p>
                
                <table class="analysis-table">
                    <tr>
                        <th>Metric</th>
                        <th>Value</th>
                        <th>Interpretation</th>
                    </tr>
                    <tr>
                        <td>Total Dialogue Segments Found</td>
                        <td>${totalSegments}</td>
                        <td>How many times a character spoke.</td>
                    </tr>
                    <tr>
                        <td>Total Words in Dialogue</td>
                        <td>${totalDialogueWords}</td>
                        <td>Total volume of spoken words.</td>
                    </tr>
                    <tr>
                        <td><strong>Average Words Per Speech</strong></td>
                        <td><strong>${avgDialogueLength} words</strong></td>
                        <td>Key metric for assessing pacing.</td>
                    </tr>
                    <tr>
                        <td>Dialogue Density</td>
                        <td>${((totalDialogueWords / totalWordsInFullText) * 100).toFixed(1)}%</td>
                        <td>Percentage of the total text that is dialogue.</td>
                    </tr>
                </table>
            `;

            outputDiv.innerHTML = html;
        }

        // Initialize with default text
        document.addEventListener('DOMContentLoaded', () => {
             document.getElementById('textInput').value = "Sarah laughed and said, 'Can you believe we almost missed the flight?' David responded, 'Absolutely not! I set three alarms just for this morning.' Sarah, checking her bag, murmured, 'Well, thank goodness for triple-redundancy. Now, where is my passport?' David sighed, 'It is on your head.'";
             analyzeDialogue();
        });
    </script>

</body>
</html>
