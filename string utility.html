<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>String Utility</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f3f5f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 800px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .tabs {
      display: flex;
      background: #2c3e50;
    }
    .tab-button {
      flex: 1;
      padding: 15px;
      cursor: pointer;
      text-align: center;
      color: white;
      border: none;
      background: #34495e;
      font-size: 16px;
      transition: background 0.3s;
    }
    .tab-button.active {
      background: #1abc9c;
    }
    .tab-content {
      display: none;
      padding: 20px;
    }
    .tab-content.active {
      display: block;
    }
    textarea {
      width: 100%;
      height: 150px;
      border-radius: 8px;
      border: 1px solid #ccc;
      padding: 10px;
      resize: vertical;
      font-size: 15px;
    }
    button {
      background: #1abc9c;
      border: none;
      color: white;
      padding: 10px 15px;
      margin: 8px 5px 0 0;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #16a085;
    }
    .output {
      background: #ecf0f1;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      min-height: 40px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="tabs">
      <button class="tab-button active" data-tab="case">Case Converter</button>
      <button class="tab-button" data-tab="base64">Base64 Tools</button>
      <button class="tab-button" data-tab="text">Text Utilities</button>
    </div>

    <div id="case" class="tab-content active">
      <h3>Case Converter</h3>
      <textarea id="caseInput" placeholder="Enter text here..."></textarea>
      <div>
        <button onclick="toSnakeCase()">To snake_case</button>
        <button onclick="toCamelCase()">To camelCase</button>
        <button onclick="toPascalCase()">To PascalCase</button>
      </div>
      <div class="output" id="caseOutput"></div>
    </div>

    <div id="base64" class="tab-content">
      <h3>Base64 Encode/Decode</h3>
      <textarea id="base64Input" placeholder="Enter text here..."></textarea>
      <div>
        <button onclick="encodeBase64()">Encode</button>
        <button onclick="decodeBase64()">Decode</button>
      </div>
      <div class="output" id="base64Output"></div>
    </div>

    <div id="text" class="tab-content">
      <h3>Text Utilities</h3>
      <textarea id="textInput" placeholder="Enter text here..."></textarea>
      <div>
        <button onclick="reverseText()">Reverse</button>
        <button onclick="trimText()">Trim</button>
        <button onclick="countText()">Count</button>
      </div>
      <div class="output" id="textOutput"></div>
    </div>
  </div>

  <script>
    // Tab switching logic
    document.querySelectorAll('.tab-button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    // === Case Converter ===
    function toSnakeCase() {
      const text = document.getElementById('caseInput').value;
      const result = text.replace(/([a-z])([A-Z])/g, '$1_$2').replace(/\s+/g, '_').toLowerCase();
      document.getElementById('caseOutput').innerText = result;
    }

    function toCamelCase() {
      const text = document.getElementById('caseInput').value;
      const result = text.toLowerCase().replace(/[-_\s]+(.)?/g, (_, c) => c ? c.toUpperCase() : '');
      document.getElementById('caseOutput').innerText = result;
    }

    function toPascalCase() {
      const text = document.getElementById('caseInput').value;
      const result = text.toLowerCase().replace(/[-_\s]+(.)?/g, (_, c) => c ? c.toUpperCase() : '').replace(/^./, c => c.toUpperCase());
      document.getElementById('caseOutput').innerText = result;
    }

    // === Base64 Tools ===
    function encodeBase64() {
      const text = document.getElementById('base64Input').value;
      document.getElementById('base64Output').innerText = btoa(unescape(encodeURIComponent(text)));
    }

    function decodeBase64() {
      try {
        const text = document.getElementById('base64Input').value;
        document.getElementById('base64Output').innerText = decodeURIComponent(escape(atob(text)));
      } catch (e) {
        document.getElementById('base64Output').innerText = 'Invalid Base64 string';
      }
    }

    // === Text Utilities ===
    function reverseText() {
      const text = document.getElementById('textInput').value;
      document.getElementById('textOutput').innerText = text.split('').reverse().join('');
    }

    function trimText() {
      const text = document.getElementById('textInput').value;
      document.getElementById('textOutput').innerText = text.trim();
    }

    function countText() {
      const text = document.getElementById('textInput').value.trim();
      const charCount = text.length;
      const wordCount = text.split(/\s+/).filter(Boolean).length;
      document.getElementById('textOutput').innerText = `Characters: ${charCount}\nWords: ${wordCount}`;
    }
  </script>
</body>
</html>
